<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ebedf0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1219" media="(prefers-color-scheme: dark)" />
    <title>Ella Baché Analytics</title>
    <script>
      // Pick the theme before the page draws, so there is no white flash in dark mode.
      // Saved choice first, otherwise the computer's light/dark setting.
      try {
        var saved = localStorage.getItem('eb-theme')
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
